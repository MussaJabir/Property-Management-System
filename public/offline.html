<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>No connection · PMS</title>
<style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f6f8f8; color: #0f1f1e; }
    main { max-width: 360px; text-align: center; }
    img { width: 64px; height: 64px; border-radius: 14px; }
    h1 { font-size: 1.25rem; margin: 20px 0 8px; }
    p { margin: 0 0 20px; color: #56696a; line-height: 1.5; }
    .sw { font-style: italic; }
    button { border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; font-weight: 600;
        background: #0f766e; color: #fff; cursor: pointer; }
    @media (prefers-color-scheme: dark) {
        body { background: #0b1312; color: #e8efee; }
        p { color: #9fb2b1; }
    }
</style>
</head>
<body>
<main>
    <img src="/images/pwa/icon-192.png" alt="PMS">
    <h1>You are offline</h1>
    <p>PMS needs an internet connection. Check your data or Wi-Fi, then try again.
        <br><span class="sw">Hakuna mtandao. Angalia data au Wi-Fi, kisha jaribu tena.</span></p>
    <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
